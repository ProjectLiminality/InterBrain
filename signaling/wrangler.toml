name = "interbrain-signaling-dev"
main = "src/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Each pair-room is a Durable Object. Hibernation lets connected WebSockets
# stay open without burning CPU while idle.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
