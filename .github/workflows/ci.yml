name: CI

on:
  push:
    branches: [main, 'epic/*', 'feature/*']
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # Core Checks - Run on every commit (fast: ~2 min)
  # ============================================================================
  check-all:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        timeout-minutes: 3

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Run lint
        run: npm run lint
        timeout-minutes: 2

      - name: Run typecheck
        run: npm run typecheck
        timeout-minutes: 3

      - name: Run tests
        run: npm run test
        timeout-minutes: 5

  # ============================================================================
  # Summary Job
  # ============================================================================
  #
  # NOTE: The legacy install-script verification jobs (install.sh / install.ps1
  # syntax + per-OS Radicle/Ollama/Obsidian install checks) were removed in the
  # rc.22 cleanup. Those scripts tested the pre-pivot shell installer, which the
  # Tauri desktop daemon's first-run flow has fully replaced. Installer
  # validation now happens through the Release workflow's bundled artifacts.
  ci-summary:
    if: always()
    needs: [check-all]
    runs-on: ubuntu-latest
    steps:
      - name: CI Summary
        run: |
          echo "=== CI Summary ==="
          echo ""
          echo "Core Checks: ${{ needs.check-all.result }}"
          echo ""

          if [ "${{ needs.check-all.result }}" != "success" ]; then
            echo "FAIL: Core checks failed"
            exit 1
          fi

          echo "SUCCESS: All CI checks passed"
