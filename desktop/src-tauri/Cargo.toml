[package]
name = "interbrain-desktop"
version = "0.15.0"
description = "InterBrain — knowledge gardening companion"
authors = ["Project Liminality"]
license = "AGPL-3.0"
edition = "2021"
default-run = "interbrain-desktop"

[lib]
name = "interbrain_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "interbrain-desktop"
path = "src/main.rs"

[[bin]]
name = "git-remote-interbrain"
path = "src/bin/git_remote_interbrain.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-store = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
keyring = "3"
dirs = "5"
which = "7"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
webrtc = "0.8"
tungstenite = "0.24"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
tokio-stream = "0.1"
async-trait = "0.1"
bytes = "1"

[dev-dependencies]
tempfile = "3"
